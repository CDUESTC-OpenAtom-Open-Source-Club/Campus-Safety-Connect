name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提交前请先搜索现有 Issue，并确认建议符合项目的原生鸿蒙定位。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与要解决的问题
      description: 描述当前流程中的痛点、影响角色和触发场景
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 期望的交互、数据或流程变化；可附草图或参考截图
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 已考虑过的替代方案及其取舍
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响模块
      multiple: true
      options:
        - 事件与处置任务
        - 隐患上报
        - 数据统计
        - 账号与权限
        - 服务卡片
        - 小安 AI / 本地模型
        - 构建、签名与发布
        - 文档与协作流程
        - 其它
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: 预期影响面
      options:
        - 仅界面交互
        - 涉及数据模型或持久化
        - 涉及 AI 模型或原生运行库
        - 涉及第三方组件或许可证
        - 涉及构建、签名或发布配置
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: 是否愿意提交 PR
      options:
        - 愿意，可按 CONTRIBUTING.md 提交
        - 需要维护者指导
        - 暂不提交，仅提出建议
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 相关 Issue、竞品参考、兼容性要求等
    validations:
      required: false
